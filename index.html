}
.app { display: flex; height: 100vh; position: relative; z-index: 1; }

/* ====== 侧边栏 ====== */
.sidebar {
  width: var(--sidebar-width); min-width: var(--sidebar-width);
  background: var(--glass-sidebar-bg);
  border-right: 1px solid var(--glass-sidebar-border);
  display: flex; flex-direction: column; overflow: hidden;
  position: relative;
}
.sidebar::before,
.sidebar::after {
  display: none;
}
.sidebar-header { padding: 24px 20px 8px; flex-shrink: 0; position: relative; z-index: 3; cursor: pointer; user-select: none; }
.sidebar-header:hover .sidebar-title { color: var(--text-primary); }
.sidebar-header .sidebar-title {
  font-size: 22px; font-weight: 700; color: var(--text-primary);
  display: flex; align-items: center; gap: 6px; cursor: pointer;
  transition: color 0.25s;
}
.sidebar-header .sidebar-title .title-arrow { font-size: 10px; color: var(--text-tertiary); display: inline-block; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.sidebar-header .sidebar-zh-title { font-size: 22px; color: var(--text-primary); letter-spacing: 2px; margin-top: 1px; }
.sidebar-header .sidebar-subtitle {
  font-size: 12px; color: var(--text-tertiary); letter-spacing: 0.5px;
  margin-top: 2px;
}
.theme-switch-wrap {
  padding: 8px 20px 4px;
  flex-shrink: 0;
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.theme-switch-label {
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 500;
}
.theme-toggle {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.05);
  color: var(--text-primary);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, border-color 0.2s;
  flex-shrink: 0;
  padding: 0;
}
.theme-toggle:hover {
  background: rgba(255,255,255,0.10);
  border-color: rgba(255,255,255,0.18);
}
[data-theme="light"] .theme-toggle {
  background: #F0F0F0;
  border-color: #DDDDDD;
  color: #333333;
}
[data-theme="light"] .theme-toggle:hover {
  background: #E5E5E5;
  border-color: #CCCCCC;
}
/* 搜索框 */
.search-wrap { padding: 8px 20px 12px; flex-shrink: 0; position: relative; z-index: 3; }
.search-input {
  width: 100%; padding: 8px 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  color: var(--text-primary); font-size: 13px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}
.search-input::placeholder { color: var(--text-tertiary); }
.search-input:focus {
  border-color: var(--accent);
  background: rgba(255,255,255,0.08);
}
.search-empty {
  text-align: center; color: var(--text-tertiary); font-size: 13px;
  padding: 40px 20px;
}
/* 月份折叠组 */
.month-group { margin-bottom: 2px; }
.month-header {
  font-size: 12px; font-weight: 600; color: var(--text-secondary);
  padding: 10px 10px 4px; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 4px;
  transition: color 0.2s;
}
.month-header:hover { color: var(--text-primary); }
.month-header .month-arrow {
  font-size: 10px; display: inline-block; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  color: var(--text-tertiary); min-width: 12px;
}
.month-body {
  max-height: 100000px; overflow: hidden;
  transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
.month-body.collapsed { max-height: 0; }
.date-group-body { max-height: 100000px; overflow: hidden; transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
.date-group-body.collapsed { max-height: 0; }
.sidebar-scroll { flex: 1; overflow-y: auto; padding: 0 12px 20px; position: relative; z-index: 3; max-height: 9999px; opacity: 1; transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.sidebar.collapsed .sidebar-scroll { max-height: 0; opacity: 0; overflow: hidden; padding-top: 0; padding-bottom: 0; flex: 0 0 0; }
.sidebar.collapsed .search-wrap { display: none; }
.sidebar.collapsed .theme-switch-wrap { display: none; }
.date-sub-header {
  font-size: 11px; color: var(--text-tertiary); padding: 14px 10px 6px;
  letter-spacing: 0.3px; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 4px; transition: color 0.2s;
}
.date-sub-header:hover { color: var(--text-secondary); }
.date-arrow { font-size: 9px; display: inline-block; width: 12px; text-align: center; }
.trend-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  transition: background 0.2s;
  position: relative;
  outline: none;
}
.trend-item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
.trend-item:hover { background: rgba(255,255,255,0.04); }
.trend-item.active {
  background: var(--glass-accent-bg);
}
.trend-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 6px; bottom: 6px;
  width: 2.5px;
  background: var(--glass-accent-line);
  border-radius: 0 2px 2px 0;
}
.trend-item .trend-number {
  font-size: 20px; font-weight: 700; color: var(--text-tertiary);
  min-width: 26px; line-height: 1.3; flex-shrink: 0;
}
.trend-item.active .trend-number { color: var(--accent); }
.trend-item .trend-content { flex: 1; min-width: 0; }
.trend-item .trend-title {
  font-size: 13px; font-weight: 500; color: var(--text-secondary); line-height: 1.4;
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.trend-item.active .trend-title { color: var(--accent); }
.trend-item .trend-meta {
  display: flex; align-items: center; gap: 8px; margin-top: 4px;
}
.trend-item .trend-tag {
  font-size: 10px; color: var(--text-tertiary);
  background: rgba(255,255,255,0.05); padding: 1px 6px;
  border-radius: 3px; letter-spacing: 0.5px;
}
.trend-item .trend-signals {
  font-size: 10px; color: var(--text-tertiary);
}
.trend-item.active .trend-signals { color: var(--accent); }
/* 搜索高亮 */
.highlight { background: var(--accent-dim); color: var(--accent); border-radius: 2px; padding: 0 1px; }

/* ====== 主内容区 ====== */
.main { flex: 1; overflow-y: auto; padding: 40px 48px 60px; position: relative; z-index: 1; contain: layout style; will-change: contents; }
.content-header { margin-bottom: 28px; }
.content-header .rank-big {
  font-size: 48px; font-weight: 800;
  color: var(--accent);
  line-height: 1; letter-spacing: -1px;
}
.content-header .category-tag {
  display: inline-block; font-size: 12px; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 1.5px; margin-top: 8px;
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px;
  background: var(--surface);
}

/* ====== 卡片 ====== */
.cards { display: flex; flex-direction: column; gap: 20px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  transition: border-color 0.2s;
  position: relative;
}
.card:hover {
  border-color: var(--accent);
}
.card-title {
  font-size: 20px; font-weight: 600; color: var(--text-primary);
  margin-bottom: 14px;
}
.card-body {
  font-size: 15px; color: var(--text-primary); line-height: 1.75;
}
.card.core-insight {
  background: var(--surface);
  border: 1px solid var(--accent-dim);
  position: relative;
  overflow: hidden;
}
.card.core-insight::before {
  display: none;
}
.card.core-insight .card-body { color: var(--text-primary); font-weight: 400; letter-spacing: 0.2px; }
.card.core-insight:hover {
  border-color: var(--accent);
}
.section-label {
  font-size: 12px; font-weight: 600; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px;
}
.detail-row { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
.detail-row ul { list-style: none; padding: 0; }
.detail-row ul li {
  font-size: 15px; color: var(--text-primary); line-height: 1.75; padding: 3px 0;
}
.detail-row ul li::before { content: '→ '; color: var(--accent); font-weight: 600; }
.signals-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.signal-item {
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  text-decoration: none;
  transition: border-color 0.2s, background 0.2s;
}
.signal-item:hover {
  border-color: var(--accent);
  background: var(--accent-dim);
}
.signal-item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.signal-item .signal-source { font-size: 12px; color: var(--text-tertiary); margin-bottom: 3px; }
.signal-item .signal-title { font-size: 14px; color: var(--text-primary); font-weight: 600; margin-bottom: 4px; }
.signal-item .signal-summary { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

/* Loading & Error */
.loading-state, .error-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: calc(100vh - 100px); color: var(--text-secondary); font-size: 15px; gap: 12px;
}
.loading-spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(255,255,255,0.08);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-state .retry-btn {
  margin-top: 8px; padding: 8px 20px;
  background: rgba(51,136,204,0.2); border: 1px solid rgba(51,136,204,0.3);
  color: var(--accent-light); border-radius: 8px; cursor: pointer; font-size: 14px;
  transition: background 0.2s;
}
.error-state .retry-btn:hover { background: rgba(51,136,204,0.35); }

.empty-state {
  display: flex; align-items: center; justify-content: center;
  height: calc(100vh - 100px); color: var(--text-tertiary); font-size: 14px;
}
.content-footer {
  margin-top: 40px; text-align: center; font-size: 12px; color: var(--text-tertiary);
}
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--accent-gradient);
  color: #fff; padding: 10px 24px; border-radius: 20px;
  font-size: 14px; font-weight: 600;
  box-shadow: 0 4px 20px rgba(51,136,204,0.4);
  z-index: 100;
  opacity: 0; transition: opacity 0.35s;
  pointer-events: none;
}
.toast.visible { opacity: 1; }
.last-update { color: var(--text-tertiary); margin-left: 8px; }

/* ====== 移动端浮动按钮（已废弃，由底部导航栏替代） ====== */

/* ====== 移动端蒙层 ====== */
.mobile-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 9;
  background: rgba(0,0,0,0.5);
  opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
}
.mobile-overlay.visible { opacity: 1; pointer-events: auto; }

/* ====== 滚动条 ====== */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.08); border-radius: 2px;
}
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }

/* ====== 响应式 ====== */
/* ====== 侧滑趋势面板（移动端） ====== */
.trend-panel {
  display: none;
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 20;
  width: 280px; max-width: 85vw;
  background: var(--glass-sidebar-bg);
  backdrop-filter: blur(16px) saturate(150%);
  -webkit-backdrop-filter: blur(16px) saturate(150%);
  border-right: 1px solid var(--glass-sidebar-border);
  border-radius: 0;
  transform: translateX(-100%);
  transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
  box-shadow: 8px 0 40px rgba(0,0,0,0.6);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.trend-panel.open { transform: translateX(0); }
.panel-handle-row {
  display: flex; justify-content: center; padding: 10px 0 0;
  flex-shrink: 0;
}
.panel-handle-row::after {
  content: ''; width: 36px; height: 4px;
  background: rgba(255,255,255,0.22); border-radius: 2px;
}
.panel-top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 20px 0; flex-shrink: 0;
}
.panel-top-bar .panel-title {
  font-size: 14px; font-weight: 600; color: var(--text-secondary);
}
.panel-top-bar .panel-close {
  font-size: 13px; color: var(--text-tertiary); cursor: pointer;
  padding: 4px 8px; border-radius: 6px;
  transition: color 0.2s, background 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.panel-top-bar .panel-close:active { color: var(--text-primary); background: rgba(255,255,255,0.06); }
.panel-search-wrap { padding: 8px 20px 12px; flex-shrink: 0; }
.panel-search-input {
  width: 100%; padding: 8px 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  color: var(--text-primary); font-size: 13px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}
.panel-search-input::placeholder { color: var(--text-tertiary); }
.panel-search-input:focus {
  border-color: var(--accent);
  background: rgba(255,255,255,0.08);
}
.panel-scroll { flex: 1; overflow-y: auto; padding: 0 12px 20px; -webkit-overflow-scrolling: touch; }

/* ====== 趋势条目预览摘要 ====== */
.trend-summary {
  font-size: 12px; color: var(--text-tertiary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-top: 2px; max-width: 100%;
}

/* ====== 内容区滑动过渡动画 ====== */
.swipe-area {
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
}
.swipe-area.swiping-next { transform: translateX(-110%); opacity: 0.3; }
.swipe-area.swiping-prev { transform: translateX(110%); opacity: 0.3; }

/* ====== 汉堡菜单按钮（移动端） ====== */
.hamburger-btn {
  display: none;
  flex-shrink: 0;
  width: 38px; height: 38px;
  background: rgba(10,14,24,0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  cursor: pointer;
  flex-direction: column;
  align-items: center; justify-content: center;
  gap: 5px;
  -webkit-tap-highlight-color: transparent;
  padding: 0; transition: background 0.2s;
}
.hamburger-btn:active { background: rgba(255,255,255,0.08); }
.hamburger-btn .hamburger-line {
  width: 18px; height: 2px;
  background: var(--text-secondary);
  border-radius: 1px;
  transition: transform 0.3s, opacity 0.3s;
}
.hamburger-btn.open .hamburger-line:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}
.hamburger-btn.open .hamburger-line:nth-child(2) {
  opacity: 0;
}
.hamburger-btn.open .hamburger-line:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

/* ====== 关于弹窗 ====== */
.about-modal {
  display: none;
  position: fixed; inset: 0; z-index: 30;
  background: rgba(0,0,0,0.6);
  align-items: center; justify-content: center;
}
.about-modal.visible { display: flex; }
.about-dialog {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 28px 24px;
  max-width: 320px; width: calc(100% - 48px);
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}
.about-dialog h3 {
  font-size: 18px; font-weight: 700; color: var(--text-primary);
  margin-bottom: 12px;
}
.about-dialog p {
  font-size: 13px; color: var(--text-secondary); line-height: 1.7;
  margin-bottom: 8px;
}
.about-dialog .about-close {
  margin-top: 16px; width: 100%; padding: 10px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px; color: var(--text-primary); font-size: 14px;
  cursor: pointer; transition: background 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.about-dialog .about-close:active { background: rgba(255,255,255,0.12); }

<script>
(function(){
  var ALL_ITEMS = [];
  var groups = [];
  var activeItemId = null;
  var sidebarCollapsed = false;
  var panelOpen = false;
  var searchQuery = '';
  var panelSearchQuery = '';
  var highlightedItemIdx = -1;

  function esc(s){ if(!s)return ''; var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function formatDateLabel(ds){ var d=new Date(ds+'T00:00:00'); return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+['日','一','二','三','四','五','六'][d.getDay()]; }

  function groupByDate(items){
    var g={};
    items.forEach(function(i){
      if(!i.date) return; // 跳过 date 为 null/undefined 的条目
      if(!g[i.date])g[i.date]=[];
      g[i.date].push(i);
    });
    var sd=Object.keys(g).sort(function(a,b){return b.localeCompare(a);});
    return sd.map(function(d){return {date:d,items:g[d]};});
  }

  // ===== 主题切换 =====
  function toggleTheme(){
    var html = document.documentElement;
    var current = html.getAttribute('data-theme');
    var next = current === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    localStorage.setItem('fi-theme-preference', next);
    updateThemeIcon(next);
  }
  window.toggleTheme = toggleTheme;

  function updateThemeIcon(theme){
    var btns = document.querySelectorAll('.theme-toggle');
    btns.forEach(function(btn){
      btn.textContent = theme === 'light' ? '\u{1F319}' : '\u{2600}\u{FE0F}';
    });
  }

  function initTheme(){
    var html = document.documentElement;
    var stored = localStorage.getItem('fi-theme-preference');
    if(stored){
      html.setAttribute('data-theme', stored);
      updateThemeIcon(stored);
      return;
    }
    if(window.matchMedia('(prefers-color-scheme: dark)').matches){
      html.setAttribute('data-theme', 'dark');
      updateThemeIcon('dark');
    } else {
      html.setAttribute('data-theme', 'light');
      updateThemeIcon('light');
    }
  }

  initTheme();

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e){
    if(localStorage.getItem('fi-theme-preference')) return;
    var theme = e.matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    updateThemeIcon(theme);
  });

  // ===== 数据加载 =====
  function loadData(){
    var mainEl = document.getElementById('mainContent');
    var sidebarScroll = document.getElementById('sidebarScroll');
    mainEl.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div><span>加载趋势数据中...</span></div>';
    if(sidebarScroll) sidebarScroll.innerHTML = '';

    fetch('data.json?_=' + Date.now())
      .then(function(res){
        if(!res.ok) throw new Error('HTTP '+res.status);
        return res.json();
      })
      .then(function(data){
        ALL_ITEMS = data.filter(function(i){ return i.date; });
        if(!ALL_ITEMS.length) throw new Error('数据为空');
        groups = groupByDate(ALL_ITEMS);
        activeItemId = groups[0].items[0].id;
        lastUpdateTime = new Date();
        renderSidebar();
        renderPanel();
        renderMain();
        renderDateCapsules();
        startPolling();
      })
      .catch(function(err){
        mainEl.innerHTML = '<div class="error-state"><span>数据加载失败：'+esc(err.message)+'</span><span style="font-size:13px;color:var(--text-tertiary)">请确认 data.json 文件存在于同目录下</span><button class="retry-btn" onclick="location.reload()">重新加载</button></div>';
      });
  }

  // ===== 轮询机制 =====
  var pollTimer = null;
  var lastUpdateTime = null;

  function startPolling(){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(checkForUpdates, 300000);
  }

  function checkForUpdates(){
    fetch('data.json?_=' + Date.now())
      .then(function(res){
        if(!res.ok) return;
        return res.json();
      })
      .then(function(data){
        if(!data || !data.length) return;
        var valid = data.filter(function(i){ return i.date; });
        if(valid.length > ALL_ITEMS.length){
          var newCount = valid.length - ALL_ITEMS.length;
          ALL_ITEMS = valid;
          groups = groupByDate(ALL_ITEMS);
          lastUpdateTime = new Date();
          renderSidebar();
          renderPanel();
          if(!ALL_ITEMS.find(function(x){return x.id===activeItemId;})){
            activeItemId = groups[0].items[0].id;
          }
          renderMain();
          renderDateCapsules();
          showToast('发现 ' + newCount + ' 条新趋势');
        }
      })
      .catch(function(){});
  }

  function showToast(msg){
    var toast = document.getElementById('toast');
    if(!toast) return;
    toast.textContent = msg;
    toast.classList.add('visible');
    setTimeout(function(){
      toast.classList.remove('visible');
    }, 3000);
  }

  function getLastUpdateTime(){
    if(!lastUpdateTime) return '--:--:--';
    var h = String(lastUpdateTime.getHours()).padStart(2,'0');
    var m = String(lastUpdateTime.getMinutes()).padStart(2,'0');
    var s = String(lastUpdateTime.getSeconds()).padStart(2,'0');
    return h + ':' + m + ':' + s;
  }

  function getFooterText(){
    if(!ALL_ITEMS.length) return '';
    var dates=Array.from(new Set(ALL_ITEMS.map(function(i){return i.date;}))).filter(Boolean).sort();
    var fd=parseInt(dates[0].substr(8,2));
    var fm=parseInt(dates[0].substr(5,2));
    var fy=parseInt(dates[0].substr(0,4));
    var ld=parseInt(dates[dates.length-1].substr(8,2));
    var lm=parseInt(dates[dates.length-1].substr(5,2));
    var ly=parseInt(dates[dates.length-1].substr(0,4));
    var monthStr=fy===ly&&fm===lm?(fy+'年'+fm+'月'):(fy+'年'+fm+'月-'+ly+'年'+lm+'月');
    var rangeStr=fm===lm?('覆盖'+fm+'月'+fd+'日至'+ld+'日'):('覆盖'+fm+'月'+fd+'日至'+lm+'月'+ld+'日');
    var d1=new Date(dates[0]),d2=new Date(dates[dates.length-1]);
    var spanDays=Math.floor((d2-d1)/86400000)+1;
    var cov=dates.length===spanDays?'每天均有 AI 重大事件':('共 '+dates.length+' 天有 AI 重大事件');
    return monthStr+' · 共 '+ALL_ITEMS.length+' 条趋势 · '+rangeStr+'，'+cov;
  }

  // ===== 侧边栏折叠（桌面端） =====
  window.toggleSidebar = function(){
    sidebarCollapsed = !sidebarCollapsed;
    var sb = document.getElementById('sidebar');
    var arrow = document.getElementById('titleArrow');
    var header = document.getElementById('sidebarHeader');
    if(sidebarCollapsed){
      sb.classList.add('collapsed');
      arrow.textContent = '▶';
      header.setAttribute('aria-expanded', 'false');
    }else{
      sb.classList.remove('collapsed');
      arrow.textContent = '▼';
      header.setAttribute('aria-expanded', 'true');
    }
  };

  // ===== 选中条目 =====
  var _selectTimeout=null, _selectPending=null;
  window.selectItem = function(id){
    if(_selectTimeout){clearTimeout(_selectTimeout);}
    if(_selectPending){cancelAnimationFrame(_selectPending);}
    _selectTimeout=setTimeout(function(){
      if(activeItemId===id)return;
      activeItemId=id;
      _selectPending=requestAnimationFrame(function(){
        _selectPending=null;
        renderSidebar();
        renderPanel();
        renderMain();
        renderDateCapsules();
        // Close panel after selection on mobile
        if(panelOpen) closeTrendPanel();
      });
    },16);
  };

  // ===== 搜索 =====
  window.onSearch = function(q){
    searchQuery = q.trim().toLowerCase();
    highlightedItemIdx = -1;
    renderSidebar();
  };

  // ===== 面板搜索（移动端） =====
  window.onPanelSearch = function(q){
    panelSearchQuery = q.trim().toLowerCase();
    renderPanel();
  };

  // ===== 构建趋势条目HTML =====
  function buildTrendItemHtml(it, g, query){
    var titleLower = it.title.toLowerCase();
    if(query && titleLower.indexOf(query)===-1) return null;
    var num = String(g.items.findIndex(function(t){return t.id===it.id;})+1).padStart(2,'0');
    var sigCount = it.signals?it.signals.length:0;
    var displayTitle = query ? highlightText(it.title, query) : esc(it.title);
    var summary = it.coreInsight ? it.coreInsight.substring(0, 20) : '';
    var html = '<div class="trend-item'+(it.id===activeItemId?' active':'')+'" role="option" aria-selected="'+(it.id===activeItemId)+'" tabindex="0" data-id="'+it.id+'" onclick="selectItem('+it.id+')" onkeydown="onItemKeydown(event,'+it.id+')">';
    html += '<span class="trend-number">'+num+'</span>';
    html += '<div class="trend-content">';
    html += '<div class="trend-title">'+displayTitle+'</div>';
    if(summary){
      html += '<div class="trend-summary">'+esc(summary)+'</div>';
    }
    html += '<div class="trend-meta"><span class="trend-tag">趋势</span><span class="trend-signals">'+sigCount+' 信息源</span></div>';
    html += '</div></div>';
    return {hasVisible: true, html: html};
  }

  // ===== 渲染侧边栏（桌面端） =====
  function renderSidebar(){
    var monthGroups = [];
    var currentMonth = null;
    groups.forEach(function(g){
      var monthKey = g.date.substring(0, 7);
      if(!currentMonth || currentMonth.key !== monthKey){
        currentMonth = { key: monthKey, dates: [] };
        monthGroups.push(currentMonth);
      }
      currentMonth.dates.push(g);
    });

    updateSubtitle(monthGroups);

    var h = '';
    monthGroups.forEach(function(mg, mgIdx){
      var parts = mg.key.split('-');
      var monthLabel = parts[0] + '年' + parseInt(parts[1]) + '月';
      var isFirst = mgIdx === 0;
      var firstDate = isFirst;
      var monthBodyHtml = '';

      mg.dates.forEach(function(g){
        var groupHasVisible = false;
        var groupHtml = '';
        g.items.forEach(function(it){
          var result = buildTrendItemHtml(it, g, searchQuery);
          if(result){
            groupHasVisible = true;
            groupHtml += result.html;
          }
        });
        if(groupHasVisible){
          monthBodyHtml += '<div class="date-sub-header" onclick="toggleDateGroup(this)">';
          monthBodyHtml += '<span class="date-arrow">'+(firstDate?'▼':'▶')+'</span>';
          monthBodyHtml += formatDateLabel(g.date)+'</div>';
          monthBodyHtml += '<div class="date-group-body'+(firstDate?'':' collapsed')+'">';
          monthBodyHtml += groupHtml+'</div>';
          if(firstDate) firstDate = false;
        }
      });

      if(monthBodyHtml){
        h += '<div class="month-group">';
        h += '<div class="month-header" onclick="toggleMonth(this)">';
        h += '<span class="month-arrow">'+(isFirst?'▼':'▶')+'</span> '+monthLabel;
        h += '</div>';
        h += '<div class="month-body'+(isFirst?'':' collapsed')+'">';
        h += monthBodyHtml;
        h += '</div></div>';
      }
    });

    if(!h){
      h = '<div class="search-empty">未找到匹配的趋势</div>';
    }
    var sidebarScroll = document.getElementById('sidebarScroll');
    if(sidebarScroll) sidebarScroll.innerHTML = h;
  }

  // ===== 渲染下拉面板（移动端） =====
  function renderPanel(){
    var panelScroll = document.getElementById('panelScroll');
    if(!panelScroll) return;

    var monthGroups = [];
    var currentMonth = null;
    groups.forEach(function(g){
      var monthKey = g.date.substring(0, 7);
      if(!currentMonth || currentMonth.key !== monthKey){
        currentMonth = { key: monthKey, dates: [] };
        monthGroups.push(currentMonth);
      }
      currentMonth.dates.push(g);
    });

    var h = '';
    monthGroups.forEach(function(mg, mgIdx){
      var parts = mg.key.split('-');
      var monthLabel = parts[0] + '年' + parseInt(parts[1]) + '月';
      var isFirst = mgIdx === 0;
      var firstDate = isFirst;
      var monthBodyHtml = '';

      mg.dates.forEach(function(g){
        var groupHasVisible = false;
        var groupHtml = '';
        g.items.forEach(function(it){
          var result = buildTrendItemHtml(it, g, panelSearchQuery);
          if(result){
            groupHasVisible = true;
            groupHtml += result.html;
          }
        });
        if(groupHasVisible){
          monthBodyHtml += '<div class="date-sub-header" onclick="toggleDateGroup(this)">';
          monthBodyHtml += '<span class="date-arrow">'+(firstDate?'▼':'▶')+'</span>';
          monthBodyHtml += formatDateLabel(g.date)+'</div>';
          monthBodyHtml += '<div class="date-group-body'+(firstDate?'':' collapsed')+'">';
          monthBodyHtml += groupHtml+'</div>';
          if(firstDate) firstDate = false;
        }
      });

      if(monthBodyHtml){
        h += '<div class="month-group">';
        h += '<div class="month-header" onclick="toggleMonth(this)">';
        h += '<span class="month-arrow">'+(isFirst?'▼':'▶')+'</span> '+monthLabel;
        h += '</div>';
        h += '<div class="month-body'+(isFirst?'':' collapsed')+'">';
        h += monthBodyHtml;
        h += '</div></div>';
      }
    });

    if(!h){
      h += '<div class="search-empty">未找到匹配的趋势</div>';
    }
    panelScroll.innerHTML = h;
  }

  function updateSubtitle(monthGroups){
    var el = document.getElementById('sidebarSubtitle');
    if(!el) return;
    if(!monthGroups || monthGroups.length === 0){ el.textContent = ''; return; }
    if(monthGroups.length === 1){
      var parts = monthGroups[0].key.split('-');
      el.textContent = parts[0] + '年' + parseInt(parts[1]) + '月';
    } else {
      var first = monthGroups[0].key.split('-');
      var last = monthGroups[monthGroups.length-1].key.split('-');
      el.textContent = first[0] + '年' + parseInt(first[1]) + '月 - ' + last[0] + '年' + parseInt(last[1]) + '月';
    }
  }

  window.toggleMonth = function(header){
    var body = header.nextElementSibling;
    var arrow = header.querySelector('.month-arrow');
    if(body.classList.contains('collapsed')){
      body.classList.remove('collapsed');
      arrow.textContent = '▼';
    } else {
      body.classList.add('collapsed');
      arrow.textContent = '▶';
    }
  };

  window.toggleDateGroup = function(header){
    var body = header.nextElementSibling;
    var arrow = header.querySelector('.date-arrow');
    if(body.classList.contains('collapsed')){
      body.classList.remove('collapsed');
      arrow.textContent = '▼';
    } else {
      body.classList.add('collapsed');
      arrow.textContent = '▶';
    }
  };

  function highlightText(text, query){
    var escaped = esc(text);
    var lower = escaped.toLowerCase();
    var idx = lower.indexOf(query);
    if(idx===-1) return escaped;
    var result = '';
    var lastIdx = 0;
    while(idx!==-1){
      result += escaped.substring(lastIdx, idx);
      result += '<span class="highlight">'+escaped.substring(idx, idx+query.length)+'</span>';
      lastIdx = idx + query.length;
      idx = lower.indexOf(query, lastIdx);
    }
    result += escaped.substring(lastIdx);
    return result;
  }

  // ===== 键盘导航 =====
  window.onItemKeydown = function(event, itemId){
    if(event.key==='Enter'){
      event.preventDefault();
      selectItem(itemId);
    }else if(event.key==='ArrowDown' || event.key==='ArrowUp'){
      event.preventDefault();
      navigateItems(event.key==='ArrowDown'?1:-1);
    }
  };

  function navigateItems(direction){
    var items = document.querySelectorAll('#sidebarScroll .trend-item');
    if(!items.length) return;
    var currentIdx = -1;
    for(var i=0;i<items.length;i++){
      if(parseInt(items[i].getAttribute('data-id'))===activeItemId){ currentIdx=i; break; }
    }
    var newIdx = currentIdx + direction;
    if(newIdx < 0) newIdx = items.length - 1;
    if(newIdx >= items.length) newIdx = 0;
    var newId = parseInt(items[newIdx].getAttribute('data-id'));
    selectItem(newId);
    highlightedItemIdx = newIdx;
    items[newIdx].focus({preventScroll: false});
    items[newIdx].scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }

  // ===== 全局键盘事件 =====
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){
      if(panelOpen){
        closeTrendPanel();
      }else if(!sidebarCollapsed){
        toggleSidebar();
      }
    }
    if((e.key==='ArrowDown'||e.key==='ArrowUp') && document.activeElement && document.activeElement.closest('#sidebarScroll')){
      e.preventDefault();
    }
  });

  // ===== 移动端：侧滑趋势面板 =====
  window.toggleDrawer = function(){
    if(panelOpen){ closeTrendPanel(); } else { openTrendPanel(false); }
  };

  window.openTrendPanel = function(focusSearch){
    panelOpen = true;
    renderPanel();
    document.getElementById('trendPanel').classList.add('open');
    document.getElementById('mobileOverlay').classList.add('visible');
    document.getElementById('hamburgerBtn').classList.add('open');
    document.body.style.overflow = 'hidden';
    if(focusSearch){
      setTimeout(function(){
        var input = document.getElementById('panelSearchInput');
        if(input) input.focus();
      }, 350);
    }
  };

  window.closeTrendPanel = function(){
    panelOpen = false;
    document.getElementById('trendPanel').classList.remove('open');
    document.getElementById('mobileOverlay').classList.remove('visible');
    document.getElementById('hamburgerBtn').classList.remove('open');
    document.body.style.overflow = '';
  };

  // ===== 移动端：侧滑面板手势关闭 =====
  (function(){
    var panel = document.getElementById('trendPanel');
    var touchStartX = 0;
    panel.addEventListener('touchstart', function(e){
      touchStartX = e.touches[0].clientX;
    }, {passive: true});
    panel.addEventListener('touchend', function(e){
      var deltaX = touchStartX - e.changedTouches[0].clientX;
      if(deltaX > 80 && panel.scrollTop <= 5){
        closeTrendPanel();
      }
    });
  })();

  // ===== 移动端：内容区左右滑动翻页 =====
  (function(){
    var main = document.getElementById('mainContent');
    var touchStartX = 0, touchStartY = 0;
    var isSwiping = false;

    main.addEventListener('touchstart', function(e){
      if(e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isSwiping = false;
    }, {passive: true});

    main.addEventListener('touchmove', function(e){
      if(e.touches.length !== 1) return;
      if(isSwiping) {
        e.preventDefault();
        return;
      }
      var deltaX = e.touches[0].clientX - touchStartX;
      var deltaY = e.touches[0].clientY - touchStartY;
      if(Math.abs(deltaX) > 15 && Math.abs(deltaX) > Math.abs(deltaY)){
        isSwiping = true;
        e.preventDefault();
      }
    }, {passive: false});

    main.addEventListener('touchend', function(e){
      if(!isSwiping) return;
      isSwiping = false;
      var deltaX = e.changedTouches[0].clientX - touchStartX;
      if(Math.abs(deltaX) < 50) return;

      // Find current item's position in its date group
      var currentItem = ALL_ITEMS.find(function(x){return x.id===activeItemId;});
      if(!currentItem) return;
      var dateGroup = groups.find(function(g){return g.date===currentItem.date;});
      if(!dateGroup) return;
      var idx = dateGroup.items.findIndex(function(it){return it.id===activeItemId;});
      if(idx === -1) return;

      var targetItem = null;
      if(deltaX < -50 && idx < dateGroup.items.length - 1){
        // Swipe left → next
        targetItem = dateGroup.items[idx + 1];
      } else if(deltaX > 50 && idx > 0){
        // Swipe right → previous
        targetItem = dateGroup.items[idx - 1];
      }

      if(targetItem){
        var swipeArea = main.querySelector('.swipe-area');
        if(swipeArea){
          if(deltaX < -50){
            swipeArea.classList.add('swiping-next');
          } else {
            swipeArea.classList.add('swiping-prev');
          }
          setTimeout(function(){
            activeItemId = targetItem.id;
            renderSidebar();
            renderPanel();
            renderMain();
            renderDateCapsules();
          }, 300);
        }
      }
    });
  })();

  window.closeAboutModal = function(e){
    if(e && e.target !== document.getElementById('aboutModal')) return;
    document.getElementById('aboutModal').classList.remove('visible');
  };

  // ===== 日期胶囊（移动端） =====
  function renderDateCapsules(){
    var bar = document.getElementById('capsulesWrap');
    if(!bar) return;
    var html = '';
    groups.forEach(function(g, idx){
      var isActive = g.items.some(function(it){ return it.id === activeItemId; });
      var label = idx === 0 ? '今天' : (function(){
        var d = new Date(g.date + 'T00:00:00');
        return (d.getMonth()+1) + '月' + d.getDate() + '日';
      })();
      html += '<div class="date-capsule' + (isActive ? ' active' : '') + '" data-date="' + g.date + '" onclick="selectDateCapsule(\'' + g.date + '\')">' + label + '</div>';
    });
    bar.innerHTML = html;
  }

  window.selectDateCapsule = function(date){
    var g = groups.find(function(grp){ return grp.date === date; });
    if(!g || !g.items.length) return;
    selectItem(g.items[0].id);
  };

  // ===== 渲染主内容（含滑动包裹层） =====
  function getPerDateRank(it){
    var s = ALL_ITEMS.filter(function(t){return t.date===it.date;});
    return s.findIndex(function(t){return t.id===it.id;})+1;
  }

  function renderMain(){
    var t = ALL_ITEMS.find(function(x){return x.id===activeItemId;});
    if(!t){document.getElementById('mainContent').innerHTML='<div class="empty-state">未找到该条目</div>';return;}
    var r=getPerDateRank(t),rs=String(r).padStart(2,'0');
    var d=new Date(t.date+'T00:00:00'),wd=['日','一','二','三','四','五','六'];
    var dateTitle=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · 周'+wd[d.getDay()];
    document.getElementById('mainContent').innerHTML=
      '<div class="swipe-area" id="swipeArea">'+
      '<div class="date-capsule-bar" id="dateCapsuleBar"><button class="hamburger-btn" id="hamburgerBtn" onclick="toggleDrawer()" aria-label="打开菜单"><span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span></button><div class="capsules-wrap" id="capsulesWrap"></div></div>'+
      '<div class="content-header"><div class="rank-big">'+rs+'</div><div class="category-tag date-title">'+dateTitle+'</div><div class="category-tag desktop-tag">趋势分析 · '+formatDateLabel(t.date)+'</div></div>'+
      '<div class="date-separator"></div>'+
      '<div class="cards">'+
      '<div class="card" style="border:none;padding-bottom:8px;background:transparent;box-shadow:none"><div class="card-title">'+esc(t.title)+'</div></div>'+
      '<div class="card core-insight"><div class="card-body">'+esc(t.coreInsight)+'</div></div>'+
      '<div class="card"><div class="section-label">为什么重要</div><div class="card-body">'+esc(t.whyItMatters)+'</div></div>'+
      '<div class="card"><div class="section-label">趋势方向</div><div class="card-body">'+esc(t.direction)+'</div></div>'+
      '<div class="card"><div class="section-label">机会</div><div class="detail-row"><ul>'+((t.opportunities||[]).map(function(o){return '<li>'+esc(o)+'</li>';})).join('')+'</ul></div></div>'+
      '<div class="card"><div class="section-label">风险</div><div class="detail-row"><ul>'+((t.risks||[]).map(function(r){return '<li>'+esc(r)+'</li>';})).join('')+'</ul></div></div>'+
      '<div class="card"><div class="section-label">信息来源 · '+t.signals.length+' 条</div><div class="signals-list">'+
      (t.signals.map(function(s){return '<a href="'+esc(s.url)+'" target="_blank" rel="noopener" class="signal-item"><div class="signal-source">'+esc(s.source)+' · '+s.time+'</div><div class="signal-title">'+esc(s.title)+'</div><div class="signal-summary">'+esc(s.summary)+'</div></a>';})).join('')+
      '</div></div></div>'+
      '<div class="content-footer">'+getFooterText()+'<span class="last-update">上次更新：'+getLastUpdateTime()+'</span></div>'+
      '</div>';
    document.getElementById('mainContent').scrollTop=0;
  }

  // 启动
  loadData();
})();
</script>
</body>
</html>
